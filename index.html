<!--
- 核心理由：App 主入口。已整合「中鍵新增 ➪」、 「頂部說明按鈕」，並套用 10%~15% 黃金字體放大比例，提升行動裝置配置阻尼感與防 iOS 縮放。
- 職責邊界：[負責] 結構宣告、高保真音效式配置、安全權限字體對齊。 [不負責] 狀態管理與動態事件處理。
- MWE：直接雙擊或在本地面板伺服器開啟，完全瀏覽器版本。
- 致命錯誤邊界：防重複受控。
-->
<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="一起辦｜卡牌協作工具">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <title>一起辦｜卡牌協作工具</title>
  <style>
    :root {
      --main: #0f766e;
      --main-dark: #0d5c56;
      --bg: #eef6ff;
      --text: #102033;
      --muted: #66758a;
      --line: #dbe5ee;
      --red: #dc2626;
      --green: #07855f;
      --purple: #6d28d9;
      --shadow: 0 12px 32px rgba(16, 32, 51, .14);
      --top: env(safe-area-inset-top, 0px);
      --bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100dvh;
      background: #cfe4ff;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      touch-action: manipulation;
      cursor: pointer;
      border: 0;
    }

    button:disabled {
      opacity: .42;
      cursor: not-allowed;
    }

    /* 手機外殼與響應式 */
    .phone {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      height: 100svh;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(16, 32, 51, .08);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 431px) {
      .phone {
        margin: 16px 0;
        border-radius: 34px;
        min-height: calc(100svh - 32px);
        height: calc(100svh - 32px);
      }
    }

    /* 登入畫面 */
    .login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: linear-gradient(135deg, #e0f2fe 0%, #eef6ff 100%);
    }

    .brand-box {
      width: 100%;
    }

    .app-logo {
      margin-bottom: 24px;
      filter: drop-shadow(0 8px 16px rgba(15, 118, 110, 0.25));
    }

    .brand-box h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 950;
      color: var(--main);
    }

    .brand-box p {
      margin: 0 0 32px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 700;
    }

    .google-btn {
      width: 100%;
      height: 52px;
      border-radius: 18px;
      background: white;
      color: var(--text);
      font-weight: 950;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(16, 32, 51, 0.08);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .google-btn:active {
      background: #f8fafc;
    }

    /* 主應用 Shell */
    .appShell {
      flex: 1;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .topDock {
      flex: 0 0 auto;
      position: relative;
      z-index: 20;
      background: rgba(238, 246, 255, .98);
      color: var(--text);
      padding: calc(10px + var(--top)) 12px 10px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      border: 1px solid rgba(219, 229, 238, .92);
      border-top: 0;
      box-shadow: 0 8px 22px rgba(16, 32, 51, .12);
    }

    .topRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      margin-bottom: 9px;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.12;
      font-weight: 950;
      color: var(--text);
      word-break: keep-all;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      font-weight: 850;
    }

    .identityRow {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .mode {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--main);
      border: 1px solid rgba(15, 118, 110, .45);
      color: white;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(15, 118, 110, .20);
    }

    .logout-btn {
      min-height: 32px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      padding: 4px 9px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(16, 32, 51, .06);
    }

    .info-btn {
      background: white;
      border: 1px solid var(--line);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 950;
      box-shadow: 0 2px 8px rgba(16, 32, 51, .06);
    }

    .info-btn:active,
    .logout-btn:active {
      background: #f8fafc;
    }

    /* 主要操作導覽按鈕區 (統一樣式 - 深對比高立體感設計) */
    .primaryNav {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px; /* 稍微拉大，便於行動端操作點擊 */
    }

    .navBtn {
      height: 54px;
      border-radius: 18px;
      
      /* --- 高對比度/立體感設計：未點選狀態 --- */
      background: #ffffff;
      border: 2px solid #64748b; /* 明確邊框、高可視度 */
      color: #334155;            /* 深色清晰字體 */
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.1); /* 立體投影 */
      
      font-size: 12px;
      font-weight: 950;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .navBtn b {
      font-size: 20px;
      line-height: 1;
    }

    /* --- 高對比度/立體感設計：選中啟用狀態 (on) --- */
    .navBtn.on {
      background: var(--main) !important;
      border-color: var(--main-dark) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3) !important;
    }

    .navBtn.on b {
      color: #ffffff !important;
    }

    /* 按鍵實體回饋 */
    .navBtn:active {
      transform: scale(0.94);
      background: #e2e8f0;
      border-color: #475569;
    }

    .navBtn.on:active {
      transform: scale(0.94);
      background: var(--main-dark) !important;
    }

    /* 紅色警告/紫色管理高對比特定樣式 */
    .navBtn.danger {
      color: #b91c1c;
      border-color: #fca5a5;
      background: #fef2f2;
    }
    .navBtn.danger.on {
      background: var(--red) !important;
      border-color: #991b1b !important;
      color: #ffffff !important;
    }

    .navBtn.manage {
      color: var(--purple);
      border-color: #ddd6fe;
      background: #f5f3ff;
    }
    .navBtn.manage.on {
      background: var(--purple) !important;
      border-color: #4c1d95 !important;
      color: #ffffff !important;
    }

    /* 特殊「新增」按鈕：高對比中鍵視覺 */
    .navBtn.add-primary {
      color: var(--main);
      border-color: var(--main);
      background: #ffffff;
    }

    .navBtn.add-primary b {
      font-size: 24px;
      background: var(--main);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1px;
      box-shadow: 0 4px 10px rgba(15, 118, 110, 0.3);
      transition: background 0.1s ease;
    }

    .navBtn.add-primary:active {
      background: #f0fdfa;
    }

    .navBtn.add-primary:active b {
      background: var(--main-dark);
    }

    /* 強制輸入框於行動端不觸發自動放大縮寫 */
    .say input, .form input, .form textarea {
      font-size: 16px !important;
    }

    /* 內容捲動區 */
    .content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px 12px calc(16px + var(--bottom));
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    /* 統計面板面板 */
    .panel {
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(219, 229, 238, .9);
      border-radius: 22px;
      padding: 13px;
      margin-bottom: 12px;
      box-shadow: 0 8px 22px rgba(16, 32, 51, .08);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 10px 4px;
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 22px;
      line-height: 1;
      font-weight: 950;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 900;
      white-space: nowrap;
    }

    .sectionTitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      font-weight: 950;
      margin: 4px 4px 9px;
    }

    /* 卡片與內容樣式 */
    .cards {
      display: grid;
      gap: 12px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(16, 32, 51, .08);
      position: relative;
    }

    .card.selected {
      outline: 3px solid rgba(15, 118, 110, .22);
    }

    .card.ended {
      opacity: .78;
    }

    .cardTop {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .title {
      font-size: 19px;
      line-height: 1.35;
      font-weight: 950;
      word-break: break-all;
    }

    .state {
      border-radius: 999px;
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 950;
      white-space: nowrap;
    }

    .open {
      background: #f1f5f9;
      color: #475569;
    }

    .done {
      background: #ecfdf5;
      color: var(--green);
    }

    .putaway {
      background: #f3f4f6;
      color: #6b7280;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 750;
    }

    .body {
      margin-top: 10px;
      background: #f8fafc;
      border-radius: 15px;
      padding: 12px;
      color: #334155;
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .body.fold {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .textBtn {
      background: transparent;
      color: var(--main);
      font-size: 14px;
      font-weight: 950;
      padding: 7px 0 0;
    }

    /* 留言與備忘 */
    .notes {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .note {
      background: #f8fafc;
      border: 1px solid #edf2f7;
      border-radius: 16px;
      padding: 10px;
    }

    .noteTop {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .tag {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 950;
      background: #eef2ff;
      color: #4f46e5;
    }

    .noteText {
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .say {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 7px;
      margin-top: 12px;
    }

    .say input {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 9px;
      min-width: 0;
      background: white;
    }

    .say button {
      border-radius: 14px;
      background: var(--main);
      color: white;
      font-weight: 950;
    }

    /* 歷史記錄面板 */
    .log {
      max-height: 55vh;
      overflow-y: auto;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 18px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .empty {
      display: none;
      background: rgba(255, 255, 255, .82);
      border: 1px dashed var(--line);
      border-radius: 22px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
    }

    .empty.show {
      display: block;
    }

    /* Bottom Sheet 與 Mask 面板 */
    .sheetMask, .confirmMask {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, .34);
      z-index: 40;
      display: none;
    }

    .sheetMask.show, .confirmMask.show {
      display: block;
    }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 10px 16px calc(16px + var(--bottom));
      box-shadow: 0 -18px 38px rgba(15, 23, 42, .22);
      transform: translateY(105%);
      transition: .22s ease;
      z-index: 41;
    }

    .sheet.show {
      transform: translateY(0);
    }

    .handle {
      width: 44px;
      height: 5px;
      background: #d1dbe6;
      border-radius: 999px;
      margin: 0 auto 12px;
    }

    .sheet h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    .form input, .form textarea {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
    }

    .form input {
      height: 52px;
    }

    .form textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
    }

    .sheetActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sheetActions button {
      height: 48px;
      border-radius: 17px;
      font-weight: 950;
      font-size: 15px;
    }

    .cancel {
      background: #f1f5f9;
      color: #475569;
    }

    .submit {
      background: var(--main);
      color: white;
    }

    /* 確認對話面板 */
    .confirmBox {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 45;
      background: white;
      border-radius: 26px;
      padding: 18px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, .26);
      display: none;
    }

    .confirmBox.show {
      display: block;
    }

    .confirmBox h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .confirmBox p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
      font-weight: 800;
    }

    .confirmActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .confirmActions button {
      height: 48px;
      border-radius: 17px;
      font-weight: 950;
      font-size: 15px;
    }

    .confirmNo {
      background: #f1f5f9;
      color: #475569;
    }

    .confirmYes {
      background: var(--main);
      color: white;
    }

    .confirmYes.danger {
      background: var(--red);
    }

    /* Toast 通知 */
    .toast {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(18px + var(--bottom));
      z-index: 60;
      background: rgba(15, 23, 42, .94);
      color: white;
      border-radius: 999px;
      padding: 13px 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      display: none;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 480px) {
      .phone { max-width: none; border-radius: 0; }
      .topDock { padding: calc(8px + var(--top)) 10px 8px; border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; }
      .topRow { grid-template-columns: 1fr; gap: 7px; margin-bottom: 8px; }
      .identityRow { justify-content: flex-start; }
      .brand h1 { font-size: 19px; }
      .brand p { font-size: 12px; }
      .mode { max-width: min(230px, 64vw); }
      .content { padding: 10px 10px calc(14px + var(--bottom)); }
    }


    /* 影響視障/放大字型與操作軌跡：完全整合高對比導覽列樣式 */
    :root {
      --a11y-title: 26px;
      --a11y-subtitle: 19px;
      --a11y-control: 19px;
      --a11y-small: 17px;
      --a11y-body: 21px;
      --a11y-card-title: 25px;
      --a11y-touch: 60px;
    }

    .brand h1 { font-size: var(--a11y-title) !important; line-height: 1.2 !important; }
    .brand p { font-size: var(--a11y-subtitle) !important; line-height: 1.45 !important; }
    .mode, .logout-btn, .info-btn { font-size: var(--a11y-small) !important; min-height: 44px !important; }
    .info-btn { width: 44px !important; height: 44px !important; }
    
    .primaryNav { gap: 7px !important; }
    
    /* 視障放大模式下的覆寫：僅放大高度與字型，保留基礎的高對比 2px 邊框與選中顏色 */
    .navBtn { 
      height: 64px !important; 
      min-height: 64px !important; 
      border-radius: 18px !important; 
      font-size: var(--a11y-small) !important; 
      line-height: 1.16 !important; 
    }
    .navBtn b { font-size: 27px !important; line-height: 1 !important; }
    
    .sectionTitle { font-size: var(--a11y-control) !important; line-height: 1.4 !important; }
    .stat b { font-size: 33px !important; }
    .stat span { font-size: var(--a11y-small) !important; line-height: 1.3 !important; }
    .title { font-size: var(--a11y-card-title) !important; line-height: 1.45 !important; }
    .state { font-size: 16px !important; }
    .meta { font-size: var(--a11y-small) !important; line-height: 1.55 !important; }
    .body { font-size: var(--a11y-body) !important; line-height: 1.75 !important; }
    .textBtn, .tag, .noteTop, .hint { font-size: var(--a11y-small) !important; line-height: 1.5 !important; }
    .noteText { font-size: 20px !important; line-height: 1.7 !important; }
    .say input, .say button, .form input, .form textarea, .sheetActions button, .confirmActions button { font-size: var(--a11y-control) !important; min-height: var(--a11y-touch) !important; }
    .form textarea { min-height: 160px !important; line-height: 1.75 !important; }
    .sheet h2, .confirmBox h2 { font-size: 27px !important; line-height: 1.35 !important; }
    .confirmBox p { font-size: 21px !important; line-height: 1.7 !important; }
    .cardActionDetails > summary, .cardActionRow button { font-size: var(--a11y-small) !important; min-height: 50px !important; }
    .log { font-size: var(--a11y-small) !important; line-height: 1.75 !important; }
    .empty, .toast { font-size: var(--a11y-control) !important; line-height: 1.55 !important; }

    @media (max-width: 480px) {
      :root {
        --a11y-title: 24px;
        --a11y-subtitle: 18px;
        --a11y-control: 18px;
        --a11y-small: 16px;
        --a11y-body: 20px;
        --a11y-card-title: 24px;
        --a11y-touch: 58px;
      }
      .topDock { padding: calc(10px + var(--top)) 10px 10px !important; }
      .topRow { gap: 9px !important; margin-bottom: 10px !important; }
      .brand h1 { word-break: keep-all; }
      .mode { max-width: min(280px, 76vw) !important; }
      
      .primaryNav { gap: 5px !important; }
      
      /* 行動寬度下縮放，結構保持高對比細節不失真 */
      .navBtn { 
        height: 60px !important; 
        min-height: 60px !important; 
        font-size: 15px !important; 
        border-radius: 16px !important; 
      }
      .navBtn b { font-size: 25px !important; }
      
      .stats { gap: 6px !important; }
      .stat { padding: 11px 3px !important; }
      .stat b { font-size: 30px !important; }
      .stat span { font-size: 15px !important; }
      .card { padding: 16px !important; }
      .body { padding: 14px !important; }
    }


    /* 第一版 UI 改善：卡片外框強化、狀態色條、留言區收合控制 */
    .cards {
      gap: 16px;
    }

    .card {
      border: 2px solid #b7c7d9 !important;
      box-shadow: 0 14px 30px rgba(15, 23, 42, .13) !important;
      margin-bottom: 16px !important;
      overflow: hidden;
      isolation: isolate;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 16px;
      bottom: 16px;
      width: 5px;
      border-radius: 0 999px 999px 0;
      background: var(--main);
    }

    .card.ended::before {
      background: var(--green);
    }

    .card:has(.state.putaway)::before {
      background: #94a3b8;
    }

    .cardTop,
    .meta,
    .body,
    .textBtn,
    .notes,
    .say,
    .cardActionDetails {
      position: relative;
      z-index: 1;
    }

    .lastModified {
      margin-top: 3px;
      font-size: 12.5px;
      color: #516783;
    }

    .notes {
      border-top: 1px solid #d8e4f0;
      padding-top: 10px;
    }

    .note {
      background: #f8fafc;
      border: 1px solid #d9e4ef;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .035);
    }

    .notesToggle {
      width: 100%;
      padding: 8px 0 4px;
      text-align: left;
      color: var(--main-dark);
    }

  </style>
</head>
<body>
<div class="phone">
  
  <!-- 未授權登入畫面 -->
  <div id="loginScreen" class="login-screen">
    <div class="brand-box">
      <svg class="app-logo" width="100" height="100" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="112" fill="#0f766e"/>
        <path d="M132 170h248M132 256h188M132 342h248" stroke="#fff" stroke-width="38" stroke-linecap="round"/>
        <circle cx="376" cy="256" r="46" fill="#14b8a6"/>
      </svg>
      <h1>一起辦｜卡牌協作工具</h1>
      <p>共同任務卡牌協作系統</p>
      <button id="loginBtn" class="google-btn">使用 Google 帳號登入</button>
    </div>
  </div>

  <!-- 主應用程式頁面 -->
  <div id="mainApp" class="appShell" style="display: none;">
    <header id="topDock" class="topDock">
      <div class="topRow">
        <div class="brand">
          <h1>一起辦｜卡牌協作工具</h1>
          <p>共同任務，完成與收起需優先確認。</p>
        </div>
        <div class="identityRow">
          <span id="userBadge" class="mode">載入中</span>
          <button id="infoBtn" class="info-btn" aria-label="系統說明">ℹ️</button>
          <button id="logoutBtn" class="logout-btn">登出</button>
        </div>
      </div>
      <nav id="bottomNav" class="primaryNav" aria-label="主要操作">
        <!-- 由 ui.js 動態渲染按鈕 -->
      </nav>
    </header>

    <main class="content" id="content">
      <section class="panel stats" id="stats">
        <!-- 由 ui.js 動態填入統計數據 -->
      </section>

      <div class="sectionTitle">
        <strong id="listTitle">全部卡牌</strong>
        <span id="count">0 張</span>
      </div>

      <section id="cards" class="cards">
        <!-- 由 ui.js 動態填入卡牌列表 -->
      </section>

      <section id="records" class="log" hidden>
        <!-- 由 ui.js 動態填入 log -->
      </section>

      <section id="empty" class="empty">
        目前無任何卡牌。
      </section>
    </main>
  </div>

  <!-- Bottom Sheet 面板 -->
  <div id="mask" class="sheetMask"></div>
  <section id="sheet" class="sheet">
    <div class="handle"></div>
    <h2>新增卡牌</h2>
    <form id="newCard" class="form">
      <input id="newTitle" maxlength="40" autocomplete="off" placeholder="卡牌名稱：這張卡牌要做什麼？(必填)" required>
      <textarea id="newBody" maxlength="500" placeholder="內容說明：補充執行步驟、想法、條件或階段性成果。最多 500 字。"></textarea>
      <div class="hint" id="counter">卡牌名稱最多 40 字；內容說明最多 500 字。</div>
      <div class="sheetActions">
        <button type="button" id="cancel" class="cancel">取消</button>
        <button type="submit" class="submit">新增</button>
      </div>
    </form>
  </section>

  <!-- 行動確認對話框 -->
  <div id="confirmMask" class="confirmMask"></div>
  <section id="confirmBox" class="confirmBox">
    <h2 id="confirmTitle">確認完成</h2>
    <p id="confirmText">要將「卡牌名稱」標記為完成嗎？</p>
    <div class="confirmActions">
      <button id="confirmNo" class="confirmNo">取消</button>
      <button id="confirmYes" class="confirmYes">確認</button>
    </div>
  </section>

  <!-- Toast 提示框 -->
  <div id="toast" class="toast"></div>

</div>

<!-- 引用主程式模組 -->
<script type="module" src="src/app.js"></script>
</body>
</html>
